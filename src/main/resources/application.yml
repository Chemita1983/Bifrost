spring:
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bifrost}
    username: ${DB_USER:bifrost}
    password: ${DB_PASSWORD:bifrost}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
