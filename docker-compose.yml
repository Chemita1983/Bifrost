services:
  mariadb:
    image: mariadb:11.4
    container_name: bifrost-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-bifrost}
      MARIADB_USER: ${DB_USER:-bifrost}
      MARIADB_PASSWORD: ${DB_PASSWORD:-bifrost}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-bifrost-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - bifrost_videogames_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bifrost-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bifrost}
      DB_USER: ${DB_USER:-bifrost}
      DB_PASSWORD: ${DB_PASSWORD}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_ID: ${STEAM_ID:-}
      STEAM_PLATFORM_ID: ${STEAM_PLATFORM_ID:-6}
      STEAM_DIGITAL_PLATFORM_ID: ${STEAM_DIGITAL_PLATFORM_ID:-1}
    ports:
      - "${APP_PORT:-8080}:8080"

  web:
    # The frontend lives in its own repository (bifrost-web); WEB_PATH points to its folder.
    build: ${WEB_PATH:-../../Front/BifrostWeb}
    container_name: bifrost-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-3000}:8080"

volumes:
  bifrost_videogames_data:
